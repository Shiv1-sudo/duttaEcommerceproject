name: Deploy Django App

on:
  push:
    branches:
      - updated-project
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev liblcms2-dev libopenjp2-7
          if ! command -v sudo &> /dev/null; then
            echo "sudo could not be found"
            exit 1
          fi

      - name: Install Miniconda
        run: |
          wget https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
          bash Miniconda3-latest-Linux-x86_64.sh -b -p $HOME/miniconda3
          export PATH="$HOME/miniconda3/bin:$PATH"
          conda init
          sleep 5
          echo "Miniconda installed and PATH updated."

      - name: Apply Conda Initialization
        run: |
          source $HOME/miniconda3/etc/profile.d/conda.sh
          echo "Conda initialization applied."

      - name: Create virtual environment
        run: |
          source $HOME/miniconda3/etc/profile.d/conda.sh
          conda create -n myenv python=3.8 -y
          sleep 5
          conda info --envs
          if [ $? -ne 0 ]; then
            echo "Failed to create virtual environment"
            exit 1
          fi
          echo "Virtual environment created."

      - name: Activate virtual environment and install pip
        run: |
          source $HOME/miniconda3/etc/profile.d/conda.sh
          conda activate myenv
          sleep 10
          current_env=$(conda info --envs | grep '*' | awk '{print $1}')
          if [ "$current_env" != "myenv" ]; then
            echo "Virtual environment not activated"
            exit 1
          fi
          echo "Virtual environment activated: $current_env"
          conda install pip -y
          sleep 5
          pip install -r requirements.txt
          sleep 5
          if [ $? -ne 0 ]; then
            echo "Failed to install dependencies"
            exit 1
          fi
          echo "Dependencies installed."

      - name: Set Environment Variables
        run: |
          echo "PYTHONPATH=${{ github.workspace }}/public_html" >> $GITHUB_ENV
          echo "DJANGO_SETTINGS_MODULE=duttaEcommerceproject.settings" >> $GITHUB_ENV
          echo "DATABASE_ENGINE=django.db.backends.sqlite3" >> $GITHUB_ENV
          echo "DATABASE_NAME=${{ github.workspace }}/public_html/db.sqlite3" >> $GITHUB_ENV
          echo "DATABASE_USER=${{ secrets.DATABASE_USER }}" >> $GITHUB_ENV
          echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> $GITHUB_ENV
          echo "DATABASE_HOST=${{ secrets.DATABASE_HOST }}" >> $GITHUB_ENV
          echo "DATABASE_PORT=${{ secrets.DATABASE_PORT }}" >> $GITHUB_ENV
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> $GITHUB_ENV
          echo "DEBUG=${{ secrets.DEBUG }}" >> $GITHUB_ENV
          echo "ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}" >> $GITHUB_ENV
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> $GITHUB_ENV
          echo "EMAIL_HOST=${{ secrets.EMAIL_HOST }}" >> $GITHUB_ENV
          echo "EMAIL_PORT=${{ secrets.EMAIL_PORT }}" >> $GITHUB_ENV
          echo "EMAIL_USE_TLS=${{ secrets.EMAIL_USE_TLS }}" >> $GITHUB_ENV
          echo "EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}" >> $GITHUB_ENV
          echo "EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}" >> $GITHUB_ENV
          echo "Environment variables set."

      - name: Create Database Directory
        run: |
          mkdir -p ${{ github.workspace }}/public_html
          chmod -R 755 ${{ github.workspace }}/public_html
          echo "Database directory created."
        continue-on-error: true

      - name: Verify Database Path and Permissions
        run: |
          echo "Database path: ${{ github.workspace }}/public_html/db.sqlite3"
          ls -l ${{ github.workspace }}/public_html/
          touch ${{ github.workspace }}/public_html/db.sqlite3
          if [ $? -ne 0 ]; then
            echo "Failed to touch database file"
            exit 1
          fi
          chmod 755 ${{ github.workspace }}/public_html/db.sqlite3
          ls -l ${{ github.workspace }}/public_html/db.sqlite3
          sleep 5
          echo "Database path and permissions verified."

      - name: List Migration Files
        run: |
          ls -l ${{ github.workspace }}/duttaEcommerceapp/migrations/
          cat ${{ github.workspace }}/duttaEcommerceapp/migrations/0010_gameresult.py
          sleep 5
          echo "Migration files listed."

      - name: Deploy to Namecheap Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 21098
          script: |
            cd /home/duttvnyn/public_html
            git fetch --all
            git reset --hard origin/updated-project
            source /home/duttvnyn/miniconda3/etc/profile.d/conda.sh
            conda activate myenv
            sleep 10
            current_env=$(conda info --envs | grep '*' | awk '{print $1}')
            if [ "$current_env" != "myenv" ]; then
              echo "Virtual environment not activated. Re-activating."
              source /home/duttvnyn/miniconda3/etc/profile.d/conda.sh
              conda activate myenv
              current_env=$(conda info --envs | grep '*' | awk '{print $1}')
              if [ "$current_env" != "myenv" ]; then
                echo "Failed to re-activate virtual environment"
                exit 1
              fi
            fi
            echo "Virtual environment activated: $current_env"
            pip install -r requirements.txt
            sleep 5
            python manage.py migrate
            sleep 5
            echo "Migrations applied."

            # Restart HTTP server using all possible methods
            echo "Attempting to restart HTTP server using systemctl..."
            if command -v systemctl &> /dev/null; then
              sudo systemctl restart httpd
              if [ $? -ne 0 ]; then
                echo "Failed to restart HTTP server using systemctl"
              else
                echo "HTTP server restarted using systemctl"
                exit 0
              fi
            fi

            echo "Attempting to restart HTTP server using apachectl..."
            if command -v apachectl &> /dev/null; then
              sudo apachectl restart
              if [ $? -ne 0 ]; then
                echo "Failed to restart HTTP server using apachectl"
              else
                echo "HTTP server restarted using apachectl"
                exit 0
              fi
            fi

            echo "Attempting to restart HTTP server using httpd..."
            if command -v httpd &> /dev/null; then
              sudo httpd restart
              if [ $? -ne 0 ]; then
                echo "Failed to restart HTTP server using httpd"
              else
                echo "HTTP server restarted using httpd"
                exit 0
              fi
            fi

            echo "Attempting to restart HTTP server using apache2..."
            if command -v apache2 &> /dev/null; then
              sudo apache2 restart
              if [ $? -ne 0 ]; then
                echo "Failed to restart HTTP server using apache2"
              else
                echo "HTTP server restarted using apache2"
                exit 0
              fi
            fi

            echo "No suitable command found to restart HTTP server"
            exit 1
