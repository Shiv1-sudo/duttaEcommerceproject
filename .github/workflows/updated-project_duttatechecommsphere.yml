name: Deploy Django App

on:
  push:
    branches:
      - updated-project
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Miniconda
        run: |
          wget https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh
          bash Miniconda3-latest-Linux-x86_64.sh -b -p $HOME/miniconda3
          export PATH="$HOME/miniconda3/bin:$PATH"
          conda init bash
          echo "Miniconda installed and PATH updated."

      - name: Create and activate virtual environment
        run: |
          source $HOME/miniconda3/etc/profile.d/conda.sh
          conda create -n myenv python=3.8 -y
          source activate myenv
          conda activate myenv
          conda info --envs
          echo "Virtual environment created and activated."

      - name: Install dependencies
        run: |
          source $HOME/miniconda3/etc/profile.d/conda.sh
          conda activate myenv
          pip install -r requirements.txt
          echo "Dependencies installed."

      - name: Set Environment Variables
        run: |
          echo "PYTHONPATH=${{ github.workspace }}/public_html" >> $GITHUB_ENV
          echo "DJANGO_SETTINGS_MODULE=duttaEcommerceproject.settings" >> $GITHUB_ENV
          echo "DATABASE_ENGINE=django.db.backends.sqlite3" >> $GITHUB_ENV
          echo "DATABASE_NAME=${{ github.workspace }}/public_html/db.sqlite3" >> $GITHUB_ENV
          echo "DATABASE_USER=${{ secrets.DATABASE_USER }}" >> $GITHUB_ENV
          echo "DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}" >> $GITHUB_ENV
          echo "DATABASE_HOST=${{ secrets.DATABASE_HOST }}" >> $GITHUB_ENV
          echo "DATABASE_PORT=${{ secrets.DATABASE_PORT }}" >> $GITHUB_ENV
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> $GITHUB_ENV
          echo "DEBUG=${{ secrets.DEBUG }}" >> $GITHUB_ENV
          echo "ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}" >> $GITHUB_ENV
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> $GITHUB_ENV
          echo "EMAIL_HOST=${{ secrets.EMAIL_HOST }}" >> $GITHUB_ENV
          echo "EMAIL_PORT=${{ secrets.EMAIL_PORT }}" >> $GITHUB_ENV
          echo "EMAIL_USE_TLS=${{ secrets.EMAIL_USE_TLS }}" >> $GITHUB_ENV
          echo "EMAIL_HOST_USER=${{ secrets.EMAIL_HOST_USER }}" >> $GITHUB_ENV
          echo "EMAIL_HOST_PASSWORD=${{ secrets.EMAIL_HOST_PASSWORD }}" >> $GITHUB_ENV
          echo "Environment variables set."

      - name: Create Database Directory
        run: |
          mkdir -p ${{ github.workspace }}/public_html
          chmod -R 755 ${{ github.workspace }}/public_html
          echo "Database directory created."
        continue-on-error: true

      - name: Verify Database Path and Permissions
        run: |
          echo "Database path: ${{ github.workspace }}/public_html/db.sqlite3"
          ls -l ${{ github.workspace }}/public_html/
          touch ${{ github.workspace }}/public_html/db.sqlite3
          chmod 755 ${{ github.workspace }}/public_html/db.sqlite3
          ls -l ${{ github.workspace }}/public_html/db.sqlite3
          echo "Database path and permissions verified."

      - name: List Migration Files
        run: |
          ls -l ${{ github.workspace }}/duttaEcommerceapp/migrations/
          cat ${{ github.workspace }}/duttaEcommerceapp/migrations/0010_gameresult.py
          echo "Migration files listed."

      - name: Run Migrations
        run: |
          source $HOME/miniconda3/etc/profile.d/conda.sh
          conda activate myenv
          python manage.py migrate

      - name: Collect Static Files
        run: |
          source
